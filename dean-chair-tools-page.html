<!-- ============================================================
     University of Vermont — Ellucian Experience Page Builder HTML
     Component: Dean & Department Chair Tools page (registrar
                deadline strip + link filter + grouped link collections)
     Notes for whoever maintains this:
       - Same design tokens and scoping convention as the Academic
         Records and Student Life pages: everything lives under
         #uvm-portal-root so nothing leaks into the Experience shell.
       - All content renders from the DEADLINES and SECTIONS arrays at
         the bottom of the <script> block. Sections, cards, links and
         the "Jump to" chips are all generated from that data.
       - The filter box searches link labels, descriptions and card
         titles across the whole page. Typing a card title (e.g.
         "grading") shows that whole card. Press Esc to clear, or "/"
         anywhere on the page to jump to the box.
       - Deadlines are filtered by date at page load: past items hide
         themselves and only the next MAX_DEADLINES are shown.
       - Links ending in .pdf / .docx / .xlsx get a file-type tag.
       - Labels and descriptions are inserted as text (escaped), so
         characters like "<" in "Students with < 12 Credits" are safe.
       - Source data: myuvm-dean-chair-links.xlsx ("Card Links" sheet).
         Exact duplicates (same label + URL on two cards) were kept on
         one card only; the removed copies are noted in comments in
         SECTIONS. "Advising Tools" and "Student Processing" are
         merged into one card.
       - Fonts: Lora (display) + Roboto (UI/body), per UVM Brand
         Guidelines v.03.24, sections 4.1 and 4.3.
   ============================================================ -->
<div id="uvm-portal-root">

  <style>
    #uvm-portal-root {
      --uvm-green: #154734;
      --uvm-green-dark: #0e3325;
      --uvm-gold: #FFD100;
      --uvm-slate: #00313C;
      --uvm-sky: #489FDF;
      --uvm-old-mill: #DC582A;
      --uvm-fog: #F7F7F7;
      --uvm-ink: #2B2B2B;
      --uvm-white: #FFFFFF;
      --uvm-radius: 10px;
      --uvm-shadow: 0 2px 6px rgba(14, 51, 37, 0.12), 0 1px 2px rgba(14, 51, 37, 0.08);

      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: var(--uvm-ink);
      box-sizing: border-box;
      max-width: 1180px;
      margin: 0 auto;
      padding: 0 16px 40px;
    }
    #uvm-portal-root *, #uvm-portal-root *::before, #uvm-portal-root *::after {
      box-sizing: inherit;
    }
    #uvm-portal-root [hidden] { display: none !important; }
    #uvm-portal-root h1, #uvm-portal-root h2, #uvm-portal-root h3 {
      font-family: 'Lora', Georgia, serif;
      color: var(--uvm-green);
      margin: 0 0 8px;
      font-weight: 600;
    }
    #uvm-portal-root a { color: var(--uvm-green); }
    #uvm-portal-root a:focus-visible,
    #uvm-portal-root button:focus-visible,
    #uvm-portal-root input:focus-visible {
      outline: 3px solid var(--uvm-sky);
      outline-offset: 2px;
    }

    /* ---------- Section scaffolding (shared with Student Life) ---------- */
    #uvm-portal-root .uvm-section {
      margin-top: 40px;
      scroll-margin-top: 16px;
    }
    #uvm-portal-root .uvm-section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      border-bottom: 3px solid var(--uvm-gold);
      padding-bottom: 8px;
    }
    #uvm-portal-root .uvm-section-head h2 {
      font-size: 1.5rem;
    }
    #uvm-portal-root .uvm-eyebrow {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--uvm-slate);
      background: var(--uvm-fog);
      border-radius: 999px;
      padding: 3px 10px;
      white-space: nowrap;
    }

    /* ================= Deadline strip (compact) ================= */
    #uvm-portal-root .uvm-deadlines {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px 28px;
      background: var(--uvm-green);
      border-left: 5px solid var(--uvm-gold);
      border-radius: var(--uvm-radius);
      padding: 14px 22px;
      color: var(--uvm-white);
    }
    #uvm-portal-root .uvm-deadlines h2 {
      color: var(--uvm-white);
      font-size: 1.05rem;
      margin: 0;
      white-space: nowrap;
    }
    #uvm-portal-root .uvm-deadline-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 12px 32px;
      flex: 1 1 auto;
    }
    #uvm-portal-root .uvm-deadline {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    #uvm-portal-root .uvm-deadline-date {
      flex-shrink: 0;
      width: 46px;
      text-align: center;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.12);
      padding: 5px 0 6px;
      line-height: 1;
    }
    #uvm-portal-root .uvm-deadline-month {
      display: block;
      font-size: 0.66rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 3px;
    }
    #uvm-portal-root .uvm-deadline-day {
      display: block;
      font-family: 'Lora', Georgia, serif;
      font-weight: 700;
      font-size: 1.2rem;
      color: var(--uvm-white);
    }
    #uvm-portal-root .uvm-deadline-title {
      display: block;
      font-weight: 700;
      font-size: 0.92rem;
      line-height: 1.3;
      color: var(--uvm-white);
    }
    #uvm-portal-root a.uvm-deadline-title { text-decoration: none; }
    #uvm-portal-root a.uvm-deadline-title:hover { text-decoration: underline; }
    #uvm-portal-root .uvm-deadline-when {
      display: block;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.78);
      line-height: 1.35;
    }
    #uvm-portal-root .uvm-deadline.is-urgent .uvm-deadline-date { background: var(--uvm-gold); }
    #uvm-portal-root .uvm-deadline.is-urgent .uvm-deadline-month,
    #uvm-portal-root .uvm-deadline.is-urgent .uvm-deadline-day { color: var(--uvm-green-dark); }
    #uvm-portal-root .uvm-deadline.is-urgent .uvm-deadline-when {
      color: var(--uvm-gold);
      font-weight: 700;
    }
    #uvm-portal-root .uvm-deadlines-cal {
      color: var(--uvm-gold);
      font-weight: 700;
      font-size: 0.85rem;
      text-decoration: none;
      white-space: nowrap;
      margin-left: auto;
    }
    #uvm-portal-root .uvm-deadlines-cal:hover { text-decoration: underline; }
    #uvm-portal-root .uvm-deadlines-empty {
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.85);
    }

    /* ================= Filter toolbar ================= */
    #uvm-portal-root .uvm-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px 20px;
      margin-top: 28px;
    }
    #uvm-portal-root .uvm-search {
      position: relative;
      flex: 1 1 320px;
      max-width: 460px;
    }
    #uvm-portal-root .uvm-search-icon {
      position: absolute;
      left: 13px;
      top: 50%;
      width: 18px;
      height: 18px;
      margin-top: -9px;
      color: var(--uvm-slate);
      pointer-events: none;
    }
    #uvm-portal-root .uvm-search input {
      width: 100%;
      font: inherit;
      font-size: 0.95rem;
      color: var(--uvm-ink);
      background: var(--uvm-white);
      border: 1px solid #CFCFCF;
      border-radius: var(--uvm-radius);
      padding: 11px 40px 11px 40px;
      -webkit-appearance: none;
      appearance: none;
    }
    #uvm-portal-root .uvm-search input::placeholder { color: #767676; }
    #uvm-portal-root .uvm-search input:focus { border-color: var(--uvm-green); }
    #uvm-portal-root .uvm-search input::-webkit-search-cancel-button { -webkit-appearance: none; }
    #uvm-portal-root .uvm-search-clear {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      width: 30px;
      height: 30px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--uvm-slate);
      font-size: 1.2rem;
      line-height: 1;
      cursor: pointer;
    }
    #uvm-portal-root .uvm-search-clear:hover { background: var(--uvm-fog); }

    #uvm-portal-root .uvm-jump {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      list-style: none;
      margin: 0;
      padding: 0;
    }
    #uvm-portal-root .uvm-jump-label {
      font-size: 0.82rem;
      color: #5A5A5A;
      margin-right: 2px;
    }
    #uvm-portal-root .uvm-jump-link {
      display: inline-block;
      font-size: 0.84rem;
      font-weight: 600;
      text-decoration: none;
      border: 1px solid #DADADA;
      border-radius: 999px;
      padding: 6px 13px;
      background: var(--uvm-white);
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    #uvm-portal-root .uvm-jump-link:hover {
      background: var(--uvm-fog);
      border-color: var(--uvm-gold);
    }
    #uvm-portal-root .uvm-search-status {
      flex-basis: 100%;
      margin: 0;
      font-size: 0.86rem;
      color: #5A5A5A;
      min-height: 1.2em;
    }
    #uvm-portal-root .uvm-no-results {
      margin-top: 24px;
      padding: 22px;
      border: 1px dashed #CFCFCF;
      border-radius: var(--uvm-radius);
      background: var(--uvm-fog);
      font-size: 0.93rem;
      line-height: 1.5;
    }
    #uvm-portal-root .uvm-no-results button {
      font: inherit;
      font-weight: 700;
      color: var(--uvm-green);
      background: none;
      border: 0;
      padding: 0;
      text-decoration: underline;
      cursor: pointer;
    }
    #uvm-portal-root mark {
      background: rgba(255, 209, 0, 0.5);
      color: inherit;
      border-radius: 2px;
      padding: 0 1px;
    }

    /* ================= Link collection cards ================= */
    #uvm-portal-root .uvm-coll-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      grid-auto-flow: row dense;
      gap: 16px;
      align-items: start;
    }
    #uvm-portal-root .uvm-coll-card {
      background: var(--uvm-white);
      border: 1px solid #E3E3E3;
      border-radius: var(--uvm-radius);
      padding: 18px 20px 8px;
    }
    #uvm-portal-root .uvm-coll-card.is-tall { grid-row: span 2; }
    #uvm-portal-root .uvm-coll-card.is-wide { grid-column: 1 / -1; }
    /* While filtering, cards shrink to their matches, so drop the row span */
    #uvm-portal-root.is-filtering .uvm-coll-card.is-tall { grid-row: auto; }
    #uvm-portal-root .uvm-coll-head {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid #E3E3E3;
    }
    #uvm-portal-root .uvm-coll-head h3 {
      font-size: 1.12rem;
      line-height: 1.25;
      margin: 0;
    }
    #uvm-portal-root .uvm-coll-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--uvm-green);
      color: var(--uvm-white);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    #uvm-portal-root .uvm-coll-icon svg { width: 18px; height: 18px; }

    #uvm-portal-root .uvm-coll-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    #uvm-portal-root .uvm-coll-card.is-wide .uvm-coll-list {
      columns: 3 240px;
      column-gap: 32px;
    }
    #uvm-portal-root .uvm-coll-list li {
      border-bottom: 1px solid #EFEFEF;
      break-inside: avoid;
    }
    #uvm-portal-root .uvm-coll-list li.is-last { border-bottom: none; }

    #uvm-portal-root .uvm-coll-link {
      display: block;
      padding: 10px 8px 10px 12px;
      margin: 0 -8px 0 -12px;
      border-left: 3px solid transparent;
      text-decoration: none;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    #uvm-portal-root .uvm-coll-link:hover {
      background: var(--uvm-fog);
      border-left-color: var(--uvm-gold);
    }
    #uvm-portal-root .uvm-coll-label {
      font-weight: 600;
      font-size: 0.93rem;
      line-height: 1.35;
      color: var(--uvm-green);
    }
    #uvm-portal-root .uvm-coll-link:hover .uvm-coll-label { text-decoration: underline; }
    #uvm-portal-root .uvm-coll-desc {
      display: block;
      font-size: 0.82rem;
      line-height: 1.4;
      color: #5A5A5A;
      margin-top: 2px;
    }
    #uvm-portal-root .uvm-filetag {
      display: inline-block;
      vertical-align: 1px;
      margin-left: 6px;
      font-size: 0.64rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--uvm-slate);
      background: var(--uvm-fog);
      border: 1px solid #DADADA;
      border-radius: 4px;
      padding: 1px 5px;
    }

    #uvm-portal-root .uvm-sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

    @media (prefers-reduced-motion: reduce) {
      #uvm-portal-root * { transition: none !important; animation: none !important; }
    }

    @media (max-width: 720px) {
      #uvm-portal-root .uvm-deadlines { padding: 14px 16px; }
      #uvm-portal-root .uvm-deadline-list { flex-direction: column; flex-basis: 100%; }
      #uvm-portal-root .uvm-deadlines-cal { margin-left: 0; }
      #uvm-portal-root .uvm-section-head { flex-wrap: wrap; }
      #uvm-portal-root .uvm-coll-card.is-tall { grid-row: auto; }
      #uvm-portal-root .uvm-search { max-width: none; }
    }
  </style>

  <!-- ================= Registrar Deadline Strip ================= -->
  <section class="uvm-section" aria-labelledby="uvmDeadlinesHeading">
    <div class="uvm-deadlines">
      <h2 id="uvmDeadlinesHeading">Coming up</h2>
      <ul class="uvm-deadline-list" id="uvmDeadlineList"></ul>
      <a class="uvm-deadlines-cal" href="https://www.uvm.edu/registrar/uvm-academic-calendar" target="_blank" rel="noopener">Academic calendar &rarr;</a>
    </div>
  </section>

  <!-- ================= Filter + jump links ================= -->
  <div class="uvm-toolbar" role="search">
    <div class="uvm-search">
      <svg class="uvm-search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="2"/>
        <path d="M15.5 15.5L20 20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <label class="uvm-sr-only" for="uvmLinkFilter">Find a report or tool</label>
      <input type="search" id="uvmLinkFilter" placeholder="Find a report or tool (e.g. roster, missing grades)" autocomplete="off" spellcheck="false" aria-describedby="uvmFilterStatus" />
      <button type="button" class="uvm-search-clear" id="uvmFilterClear" aria-label="Clear search" hidden>&times;</button>
    </div>
    <ul class="uvm-jump" id="uvmJump" aria-label="Jump to section"></ul>
    <p class="uvm-search-status" id="uvmFilterStatus" aria-live="polite"></p>
  </div>

  <div class="uvm-no-results" id="uvmNoResults" hidden></div>

  <!-- Sections and link collections are rendered here from SECTIONS -->
  <div id="uvmSections"></div>

</div>

<script>
(function () {
  'use strict';

  // Load brand fonts once (no-op if already present on the page/iframe)
  if (!document.getElementById('uvm-font-link')) {
    var link = document.createElement('link');
    link.id = 'uvm-font-link';
    link.rel = 'stylesheet';
    link.href = 'https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Roboto:wght@400;500;700;900&display=swap';
    document.head.appendChild(link);
  }

  /* ------------------------------------------------------------
     DATA — edit these arrays to update page content.
     No other part of this script needs to change.
  ------------------------------------------------------------ */

  // Deadlines: dates are 'YYYY-MM-DD'. Use endDate for ranges.
  // Past items hide themselves; only the next MAX_DEADLINES show.
  // Source: UVM Academic Calendar 2026–2027 (full-semester courses),
  // picked for what deans and chairs act on.
  var DEADLINES = [
    {
      title: 'Last day to withdraw',
      date: '2026-11-02',
      href: 'https://www.uvm.edu/registrar/online-withdrawal-policy'
    },
    // Spring 2027 schedule proofing / registration: add once published.
    // { title: 'Spring 2027 registration opens', date: '2026-11-XX',
    //   href: 'https://www.uvm.edu/registrar/registration-schedule' },
    { title: 'Thanksgiving recess', date: '2026-11-23', endDate: '2026-11-27' },
    { title: 'Last day of fall classes', date: '2026-12-11' },
    {
      title: 'Final exams',
      date: '2026-12-12',
      endDate: '2026-12-18',
      href: 'https://www.uvm.edu/registrar/final-exams'
    },
    // Final grade submission deadline: add from the registrar's grading page.
    // { title: 'Final grades due', date: '2026-12-XX' },
    { title: 'Winter Session begins', date: '2026-12-28' },
    { title: 'Spring 2027 classes begin', date: '2027-01-19' }
  ];

  var MAX_DEADLINES = 2;   // how many items the strip shows at once
  var URGENT_DAYS = 7;     // nearest item within this many days gets the gold highlight

  // Sections → cards → links. Section id is used for the "Jump to" chips.
  // Card options:
  //   tall: true  → card spans two rows on wide screens (long lists)
  //   wide: true  → card spans the full row, links flow into columns
  // Link desc is optional and is searchable.
  var SECTIONS = [
    {
      id: 'courses',
      heading: 'Courses & Scheduling',
      jump: 'Courses',
      eyebrow: 'Course reports, schedule & rosters',
      cards: [
        {
          title: 'Course Reports',
          icon: 'chart',
          tall: true,
          links: [
            { label: 'Basic Course Information', href: 'https://aisweb5.uvm.edu/ssomanager/c/SSB?pkg=hwwkcrsdatarpt.P_RunCrsDataRpt' },
            { label: 'Expanded Section Description', href: 'https://aisweb5.uvm.edu/ssomanager/c/SSB?pkg=hwwkrgrpt.P_RunESD' },
            { label: 'Instructions for Reviewing Special Topics Courses', href: 'https://myuvm.w3.uvm.edu/myuvm/prodpages/deanchair/specialTopics.docx' },
            { label: 'Distribution / Balance (GP)', desc: 'General-purpose classrooms', href: 'https://aisweb5.uvm.edu/ssomanager/c/SSB?pkg=hwwkfsocr.P_RunSMP' },
            { label: 'Distribution / Balance (ALL)', desc: 'All rooms', href: 'https://aisweb5.uvm.edu/ssomanager/c/SSB?pkg=hwwkfsocr.P_RunSMP_All' },
            { label: 'Balance for Meeting Analysis', href: 'https://aisweb5.uvm.edu/ssomanager/c/SSB?pkg=hwwkfsocr.P_RunSMPBal' },
            { label: 'Course Reason Analysis', href: 'https://serval.uvm.edu/~rgweb/batch/dean_report/reason_analysis/reason_analysis_menu.html' },
            // NOTE: this URL has a second "?" inside the pkg value; verify it resolves through SSO.
            { label: 'Course Report Menu', href: 'https://aisweb5.uvm.edu/ssomanager/c/SSB?pkg=twbkwbis.P_GenMenu?name=bmenu.P_CrsRpt' },
            { label: 'Enrollment Summary', href: 'https://serval.uvm.edu/~rgweb/batch/dean_report/enrl_menu.html' },
            { label: 'Prerequisite Report', href: 'https://aisweb5.uvm.edu/ssomanager/c/SSB?pkg=hwwkpreq.P_RunPreqRpt' }
          ]
        },
        {
          title: 'Schedule of Courses Tools',
          icon: 'calendar',
          tall: true,
          links: [
            // NOTE: same second-"?" pattern as Course Report Menu above.
            { label: 'Proof Your Courses', desc: 'Review your sections before the schedule publishes', href: 'https://aisweb5.uvm.edu/ssomanager/c/SSB?pkg=twbkwbis.P_GenMenu?name=bmenu.P_SOC' },
            { label: 'CourseLeaf', desc: 'Course action forms (Provost’s Office)', href: 'https://www.uvm.edu/provost/course-action-forms' },
            { label: 'Course Building Info', href: 'https://www.uvm.edu/registrar/course-building' },
            { label: 'Request a Change to a Section', href: 'https://myuvm.w3.uvm.edu/myuvm/prodpages/forms/soc_change_request_ad.html' },
            { label: 'Request a New Section', href: 'https://myuvm.w3.uvm.edu/myuvm/prodpages/forms/soc_newsection_request_ad.html' },
            { label: 'Request a Room Change', href: 'https://myuvm.w3.uvm.edu/myuvm/prodpages/forms/room_change_request_ad.html' },
            { label: 'General Purpose Classrooms', href: 'https://www.uvm.edu/registrar/general-purpose-classrooms' },
            { label: 'Standard Meeting Patterns', href: 'https://www.uvm.edu/registrar/standard-meeting-patterns' },
            { label: 'Standard Meeting Pattern Counts', href: 'https://aisweb5.uvm.edu/ssomanager/c/SSB?pkg=rgwk_smp_charts.P_Input' },
            { label: 'SWCSCHD Instructions', href: 'https://www.uvm.edu/registrar/swcschd-instructions' }
          ]
        },
        {
          title: 'Registration Tools',
          icon: 'roster',
          links: [
            // NOTE: Select Course and View Roster share a URL in the source sheet.
            { label: 'Select Course', href: 'https://aisweb5.uvm.edu/ssomanager/c/SSB?pkg=bwlkocrn.P_FacChmnCrnSel' },
            { label: 'View Roster', href: 'https://aisweb5.uvm.edu/ssomanager/c/SSB?pkg=bwlkocrn.P_FacChmnCrnSel' },
            { label: 'Select a Course in a New Term', href: 'https://aisweb5.uvm.edu/ssomanager/c/SSB?pkg=bwlkostm.P_FacSelTerm' },
            { label: 'Waitlisting FAQ', href: 'https://experience.elluciancloud.com/uvm/page/faculty-advisor_waitlisting_faq' },
            { label: 'RepGen Guide', href: 'https://myuvm.w3.uvm.edu/myuvm/prodpages/resources/What_is_repgen.pdf' }
          ]

    pencil: '<path d="M4 20h4.2L19.4 8.8a2 2 0 000-2.8l-1.4-1.4a2 2 0 00-2.8 0L4 15.8V20z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M13.5 6.3l4.2 4.2" fill="none" stroke="currentColor" stroke-width="1.6"/>',
    student: '<circle cx="12" cy="7.5" r="3.3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M5 20.5c.9-3.8 3.6-5.8 7-5.8s6.1 2 7 5.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',

  var root = document.getElementById('uvm-portal-root');

  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html !== undefined) e.innerHTML = html;
    return e;
  }

  var ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) { return ESC_MAP[c]; });
  }

  /* ------------------------------------------------------------
     Deadline strip
  ------------------------------------------------------------ */
  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var WEEKDAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var DAY_MS = 86400000;

  // Parse 'YYYY-MM-DD' as a local date (new Date('YYYY-MM-DD') would be UTC
  // and can land on the previous day in Eastern time).
  function parseDate(s) {
    var p = s.split('-');
    return new Date(+p[0], +p[1] - 1, +p[2]);
  }

  var now = new Date();
  var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

  function daysFromToday(d) {
    return Math.round((d - today) / DAY_MS);
  }
  function shortDate(d) {
    return MONTHS[d.getMonth()] + ' ' + d.getDate();
  }
  function whenText(start, end) {
    var startIn = daysFromToday(start);
    if (end && startIn <= 0) return 'Now, through ' + shortDate(end);
    var range = end ? shortDate(start) + '–' + shortDate(end) : WEEKDAYS[start.getDay()];
    if (startIn === 0) return 'Today';
    if (startIn === 1) return 'Tomorrow';
    if (startIn <= 14) return 'In ' + startIn + ' days';
    return range;
  }

  var upcoming = DEADLINES
    .map(function (d) {
      return { item: d, start: parseDate(d.date), end: d.endDate ? parseDate(d.endDate) : null };
    })
    .filter(function (d) { return daysFromToday(d.end || d.start) >= 0; })
    .sort(function (a, b) { return a.start - b.start; })
    .slice(0, MAX_DEADLINES);

  var deadlineList = document.getElementById('uvmDeadlineList');

  if (!upcoming.length) {
    deadlineList.appendChild(el('li', 'uvm-deadlines-empty',
      'No upcoming deadlines posted. See the academic calendar for next term.'));
  }

  upcoming.forEach(function (d, i) {
    var li = el('li', 'uvm-deadline');
    if (i === 0 && daysFromToday(d.start) <= URGENT_DAYS) li.classList.add('is-urgent');

    var titleHtml = d.item.href
      ? '<a class="uvm-deadline-title" href="' + esc(d.item.href) + '" target="_blank" rel="noopener">' + esc(d.item.title) + '</a>'
      : '<span class="uvm-deadline-title">' + esc(d.item.title) + '</span>';

    li.innerHTML =
      '<time class="uvm-deadline-date" datetime="' + esc(d.item.date) + '">' +
        '<span class="uvm-deadline-month">' + MONTHS[d.start.getMonth()] + '</span>' +
        '<span class="uvm-deadline-day">' + d.start.getDate() + '</span>' +
      '</time>' +
      '<div>' + titleHtml +
        '<span class="uvm-deadline-when">' + whenText(d.start, d.end) + '</span>' +
      '</div>';
    deadlineList.appendChild(li);
  });

  /* ------------------------------------------------------------
     Sections and link collections
  ------------------------------------------------------------ */
  var sectionsRoot = document.getElementById('uvmSections');
  var jumpList = document.getElementById('uvmJump');

  function fileType(href) {
    var m = /\.(pdf|docx?|xlsx?|pptx?)($|[?#])/i.exec(href);
    return m ? m[1].toUpperCase() : '';
  }

  // Index of everything the filter touches
  var index = [];   // [{ el, cards: [{ el, title, links: [{ li, labelEl, descEl, data, hay }] }] }]
  var totalLinks = 0;

  var jumpLabel = el('li', 'uvm-jump-label', 'Jump to');
  jumpLabel.setAttribute('aria-hidden', 'true');
  jumpList.appendChild(jumpLabel);

  SECTIONS.forEach(function (s, si) {
    var sectionId = 'uvmSection-' + (s.id || si);
    var headingId = sectionId + '-heading';
    var section = el('section', 'uvm-section');
    section.id = sectionId;
    section.setAttribute('aria-labelledby', headingId);

    var head = el('div', 'uvm-section-head');
    var h2 = el('h2');
    h2.id = headingId;
    h2.textContent = s.heading;
    head.appendChild(h2);
    if (s.eyebrow) {
      var eb = el('span', 'uvm-eyebrow');
      eb.textContent = s.eyebrow;
      head.appendChild(eb);
    }
    section.appendChild(head);

    var jli = el('li');
    var ja = el('a', 'uvm-jump-link');
    ja.href = '#' + sectionId;
    ja.textContent = s.jump || s.heading;
    jli.appendChild(ja);
    jumpList.appendChild(jli);

    var grid = el('div', 'uvm-coll-grid');
    var sectionEntry = { el: section, jumpLi: jli, cards: [] };

    s.cards.forEach(function (c) {
      var card = el('div', 'uvm-coll-card');
      if (c.tall) card.classList.add('is-tall');
      if (c.wide) card.classList.add('is-wide');

      card.innerHTML =
        '<div class="uvm-coll-head">' +
          '<span class="uvm-coll-icon"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' + (ICONS[c.icon] || '') + '</svg></span>' +
          '<h3>' + esc(c.title) + '</h3>' +
        '</div>';

      var cardEntry = { el: card, title: c.title.toLowerCase(), links: [] };
      var ul = el('ul', 'uvm-coll-list');

      c.links.forEach(function (l) {
        var li = el('li');
        var a = el('a', 'uvm-coll-link');
        a.href = l.href;
        a.target = '_blank';
        a.rel = 'noopener';

        var labelEl = el('span', 'uvm-coll-label');
        labelEl.textContent = l.label;
        a.appendChild(labelEl);

        var ft = fileType(l.href);
        if (ft) a.appendChild(el('span', 'uvm-filetag', ft));

        var descEl = null;
        if (l.desc) {
          descEl = el('span', 'uvm-coll-desc');
          descEl.textContent = l.desc;
          a.appendChild(descEl);
        }
        a.appendChild(el('span', 'uvm-sr-only', ' (opens in a new tab)'));

        li.appendChild(a);
        ul.appendChild(li);
        cardEntry.links.push({
          li: li, labelEl: labelEl, descEl: descEl, data: l,
          hay: (l.label + ' ' + (l.desc || '') + ' ' + ft).toLowerCase()
        });
        totalLinks++;
      });

      card.appendChild(ul);
      grid.appendChild(card);
      sectionEntry.cards.push(cardEntry);
    });

    section.appendChild(grid);
    sectionsRoot.appendChild(section);
    index.push(sectionEntry);
  });

  markLastVisible();

  /* ------------------------------------------------------------
     Filter
  ------------------------------------------------------------ */
  var input = document.getElementById('uvmLinkFilter');
  var clearBtn = document.getElementById('uvmFilterClear');
  var status = document.getElementById('uvmFilterStatus');
  var noResults = document.getElementById('uvmNoResults');

  // Wrap every occurrence of each term in <mark>, working on raw text
  // so overlapping terms and escaping stay correct.
  function highlight(text, terms) {
    if (!terms.length) return esc(text);
    var lower = text.toLowerCase();
    var ranges = [];
    terms.forEach(function (t) {
      var from = 0, i;
      while ((i = lower.indexOf(t, from)) !== -1) {
        ranges.push([i, i + t.length]);
        from = i + t.length;
      }
    });
    if (!ranges.length) return esc(text);
    ranges.sort(function (a, b) { return a[0] - b[0]; });
    var merged = [ranges[0]];
    for (var r = 1; r < ranges.length; r++) {
      var last = merged[merged.length - 1];
      if (ranges[r][0] <= last[1]) last[1] = Math.max(last[1], ranges[r][1]);
      else merged.push(ranges[r]);
    }
    var out = '', pos = 0;
    merged.forEach(function (m) {
      out += esc(text.slice(pos, m[0])) + '<mark>' + esc(text.slice(m[0], m[1])) + '</mark>';
      pos = m[1];
    });
    return out + esc(text.slice(pos));
  }

  function matchesAll(hay, terms) {
    for (var i = 0; i < terms.length; i++) {
      if (hay.indexOf(terms[i]) === -1) return false;
    }
    return true;
  }

  // Keep the bottom border off the last *visible* link in each card
  function markLastVisible() {
    index.forEach(function (s) {
      s.cards.forEach(function (c) {
        var lastShown = null;
        c.links.forEach(function (l) {
          l.li.classList.remove('is-last');
          if (!l.li.hidden) lastShown = l.li;
        });
        if (lastShown && !c.el.classList.contains('is-wide')) lastShown.classList.add('is-last');
      });
    });
  }

  function applyFilter() {
    var raw = input.value.trim();
    var q = raw.toLowerCase();
    var terms = q ? q.split(/\s+/) : [];
    var shown = 0;

    root.classList.toggle('is-filtering', terms.length > 0);
    clearBtn.hidden = !raw;

    index.forEach(function (s) {
      var sectionShown = 0;
      s.cards.forEach(function (c) {
        var titleHit = terms.length > 0 && matchesAll(c.title, terms);
        var cardShown = 0;
        c.links.forEach(function (l) {
          var show = !terms.length || titleHit || matchesAll(l.hay, terms);
          l.li.hidden = !show;
          var hlTerms = titleHit ? [] : terms;
          l.labelEl.innerHTML = highlight(l.data.label, hlTerms);
          if (l.descEl) l.descEl.innerHTML = highlight(l.data.desc, hlTerms);
          if (show) cardShown++;
        });
        c.el.hidden = cardShown === 0;
        sectionShown += cardShown;
      });
      s.el.hidden = sectionShown === 0;
      s.jumpLi.hidden = sectionShown === 0;
      shown += sectionShown;
    });

    markLastVisible();

    if (!terms.length) {
      status.textContent = '';
      noResults.hidden = true;
    } else if (shown) {
      status.textContent = shown + ' of ' + totalLinks + ' links match “' + raw + '”.';
      noResults.hidden = true;
    } else {
      status.textContent = 'No links match “' + raw + '”.';
      noResults.innerHTML =
        'No reports or tools match <strong>“' + esc(raw) + '”</strong>. ' +
        'Try a shorter word such as “roster”, “grade”, or “withdraw”, or ' +
        '<button type="button" id="uvmNoResultsClear">show all links</button>.';
      noResults.hidden = false;
      document.getElementById('uvmNoResultsClear').addEventListener('click', clearFilter);
    }
  }

  function clearFilter() {
    input.value = '';
    applyFilter();
    input.focus();
  }

  input.addEventListener('input', applyFilter);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && input.value) {
      e.preventDefault();
      clearFilter();
    }
  });
  clearBtn.addEventListener('click', clearFilter);

  // "/" focuses the filter unless the user is already typing somewhere
  document.addEventListener('keydown', function (e) {
    if (e.key !== '/' || e.ctrlKey || e.metaKey || e.altKey) return;
    var t = e.target;
    var typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);
    if (typing) return;
    e.preventDefault();
    input.focus();
  });

})();
