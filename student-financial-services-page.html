<!-- ============================================================
     University of Vermont — Ellucian Experience Page Builder HTML
     Component: Student Financial Services page (SFS deadline strip
                + quick access + grouped link collections)
     Notes for whoever maintains this:
       - Same design tokens, scoping (#uvm-portal-root) and data-driven
         pattern as the Academic Records and Faculty & Instructor Tools
         pages. Everything renders from DEADLINES, QUICK_LINKS and
         SECTIONS at the bottom of the <script> block.
       - No filter box: with ~20 links the whole page fits in about two
         screens, so search would add more chrome than it saves. Port
         the filter block from the Faculty page if the list grows.
       - QUICK_LINKS repeat a few links that also live in their full
         card, on purpose (same as the Faculty page).
       - Deadlines hide themselves once past; only the next
         MAX_DEADLINES show. Billing dates come from the SFS billing
         page and change every term, so restock each semester.
       - mailto: and tel: links open in place; web links open in a
         new tab. Links ending in .pdf / .docx / .xlsx get a file tag.
       - Labels/descriptions are inserted as text (escaped).
       - Source data: myUVM_student_financial_services_card_links.csv.
         Where a source URL used the retired uvm.edu underscore paths,
         the current canonical URL is used and the original is noted.
       - Fonts: Lora (display) + Roboto (UI/body), per UVM Brand
         Guidelines v.03.24, sections 4.1 and 4.3.
   ============================================================ -->
<div id="uvm-portal-root">

  <style>
    #uvm-portal-root {
      --uvm-green: #154734;
      --uvm-green-dark: #0e3325;
      --uvm-gold: #FFD100;
      --uvm-slate: #00313C;
      --uvm-sky: #489FDF;
      --uvm-old-mill: #DC582A;
      --uvm-fog: #F7F7F7;
      --uvm-ink: #2B2B2B;
      --uvm-white: #FFFFFF;
      --uvm-radius: 10px;
      --uvm-shadow: 0 2px 6px rgba(14, 51, 37, 0.12), 0 1px 2px rgba(14, 51, 37, 0.08);

      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: var(--uvm-ink);
      box-sizing: border-box;
      max-width: 1180px;
      margin: 0 auto;
      padding: 0 16px 40px;
    }
    #uvm-portal-root *, #uvm-portal-root *::before, #uvm-portal-root *::after {
      box-sizing: inherit;
    }
    #uvm-portal-root [hidden] { display: none !important; }
    #uvm-portal-root h1, #uvm-portal-root h2, #uvm-portal-root h3 {
      font-family: 'Lora', Georgia, serif;
      color: var(--uvm-green);
      margin: 0 0 8px;
      font-weight: 600;
    }
    #uvm-portal-root a { color: var(--uvm-green); }
    #uvm-portal-root a:focus-visible,
    #uvm-portal-root button:focus-visible {
      outline: 3px solid var(--uvm-sky);
      outline-offset: 2px;
    }

    /* ---------- Section scaffolding (shared with Student Life) ---------- */
    #uvm-portal-root .uvm-section {
      margin-top: 40px;
      scroll-margin-top: 16px;
    }
    #uvm-portal-root .uvm-section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      border-bottom: 3px solid var(--uvm-gold);
      padding-bottom: 8px;
    }
    #uvm-portal-root .uvm-section-head h2 {
      font-size: 1.5rem;
    }
    #uvm-portal-root .uvm-eyebrow {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--uvm-slate);
      background: var(--uvm-fog);
      border-radius: 999px;
      padding: 3px 10px;
      white-space: nowrap;
    }

    /* ================= Deadline strip (compact) ================= */
    #uvm-portal-root .uvm-deadlines {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px 28px;
      background: var(--uvm-green);
      border-left: 5px solid var(--uvm-gold);
      border-radius: var(--uvm-radius);
      padding: 14px 22px;
      color: var(--uvm-white);
    }
    #uvm-portal-root .uvm-deadlines h2 {
      color: var(--uvm-white);
      font-size: 1.05rem;
      margin: 0;
      white-space: nowrap;
    }
    #uvm-portal-root .uvm-deadline-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 12px 32px;
      flex: 1 1 auto;
    }
    #uvm-portal-root .uvm-deadline {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    #uvm-portal-root .uvm-deadline-date {
      flex-shrink: 0;
      width: 46px;
      text-align: center;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.12);
      padding: 5px 0 6px;
      line-height: 1;
    }
    #uvm-portal-root .uvm-deadline-month {
      display: block;
      font-size: 0.66rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 3px;
    }
    #uvm-portal-root .uvm-deadline-day {
      display: block;
      font-family: 'Lora', Georgia, serif;
      font-weight: 700;
      font-size: 1.2rem;
      color: var(--uvm-white);
    }
    #uvm-portal-root .uvm-deadline-title {
      display: block;
      font-weight: 700;
      font-size: 0.92rem;
      line-height: 1.3;
      color: var(--uvm-white);
    }
    #uvm-portal-root a.uvm-deadline-title { text-decoration: none; }
    #uvm-portal-root a.uvm-deadline-title:hover { text-decoration: underline; }
    #uvm-portal-root .uvm-deadline-when {
      display: block;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.78);
      line-height: 1.35;
    }
    #uvm-portal-root .uvm-deadline.is-urgent .uvm-deadline-date { background: var(--uvm-gold); }
    #uvm-portal-root .uvm-deadline.is-urgent .uvm-deadline-month,
    #uvm-portal-root .uvm-deadline.is-urgent .uvm-deadline-day { color: var(--uvm-green-dark); }
    #uvm-portal-root .uvm-deadline.is-urgent .uvm-deadline-when {
      color: var(--uvm-gold);
      font-weight: 700;
    }
    #uvm-portal-root .uvm-deadlines-cal {
      color: var(--uvm-gold);
      font-weight: 700;
      font-size: 0.85rem;
      text-decoration: none;
      white-space: nowrap;
      margin-left: auto;
    }
    #uvm-portal-root .uvm-deadlines-cal:hover { text-decoration: underline; }
    #uvm-portal-root .uvm-deadlines-empty {
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.85);
    }

    /* ================= Quick access tiles ================= */
    #uvm-portal-root .uvm-quick-grid {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 12px;
    }
    #uvm-portal-root .uvm-quick-tile {
      display: flex;
      align-items: center;
      gap: 12px;
      height: 100%;
      padding: 14px 16px;
      background: var(--uvm-white);
      border: 1px solid #E3E3E3;
      border-bottom: 3px solid var(--uvm-green);
      border-radius: var(--uvm-radius);
      text-decoration: none;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    #uvm-portal-root .uvm-quick-tile:hover {
      background: var(--uvm-fog);
      border-bottom-color: var(--uvm-gold);
    }
    #uvm-portal-root .uvm-quick-tile:hover .uvm-coll-label { text-decoration: underline; }
    #uvm-portal-root .uvm-quick-text { min-width: 0; }

    /* ================= Link collection cards ================= */
    #uvm-portal-root .uvm-coll-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      grid-auto-flow: row dense;
      gap: 16px;
      align-items: start;
    }
    #uvm-portal-root .uvm-coll-card {
      background: var(--uvm-white);
      border: 1px solid #E3E3E3;
      border-radius: var(--uvm-radius);
      padding: 18px 20px 8px;
    }
    #uvm-portal-root .uvm-coll-card.is-tall { grid-row: span 2; }
    #uvm-portal-root .uvm-coll-card.is-wide { grid-column: 1 / -1; }
    #uvm-portal-root .uvm-coll-head {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid #E3E3E3;
    }
    #uvm-portal-root .uvm-coll-head h3 {
      font-size: 1.12rem;
      line-height: 1.25;
      margin: 0;
    }
    #uvm-portal-root .uvm-coll-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--uvm-green);
      color: var(--uvm-white);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    #uvm-portal-root .uvm-coll-icon svg { width: 18px; height: 18px; }

    #uvm-portal-root .uvm-coll-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    #uvm-portal-root .uvm-coll-card.is-wide .uvm-coll-list {
      columns: 3 240px;
      column-gap: 32px;
    }
    #uvm-portal-root .uvm-coll-list li {
      border-bottom: 1px solid #EFEFEF;
      break-inside: avoid;
    }
    #uvm-portal-root .uvm-coll-list li:last-child { border-bottom: none; }
    #uvm-portal-root .uvm-coll-card.is-wide .uvm-coll-list li:last-child { border-bottom: 1px solid #EFEFEF; }

    #uvm-portal-root .uvm-coll-link {
      display: block;
      padding: 10px 8px 10px 12px;
      margin: 0 -8px 0 -12px;
      border-left: 3px solid transparent;
      text-decoration: none;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    #uvm-portal-root .uvm-coll-link:hover {
      background: var(--uvm-fog);
      border-left-color: var(--uvm-gold);
    }
    #uvm-portal-root .uvm-coll-label {
      font-weight: 600;
      font-size: 0.93rem;
      line-height: 1.35;
      color: var(--uvm-green);
    }
    #uvm-portal-root .uvm-coll-link:hover .uvm-coll-label { text-decoration: underline; }
    #uvm-portal-root .uvm-coll-desc {
      display: block;
      font-size: 0.82rem;
      line-height: 1.4;
      color: #5A5A5A;
      margin-top: 2px;
    }
    #uvm-portal-root .uvm-filetag {
      display: inline-block;
      vertical-align: 1px;
      margin-left: 6px;
      font-size: 0.64rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--uvm-slate);
      background: var(--uvm-fog);
      border: 1px solid #DADADA;
      border-radius: 4px;
      padding: 1px 5px;
    }

    #uvm-portal-root .uvm-sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

    @media (prefers-reduced-motion: reduce) {
      #uvm-portal-root * { transition: none !important; animation: none !important; }
    }

    @media (max-width: 720px) {
      #uvm-portal-root .uvm-deadlines { padding: 14px 16px; }
      #uvm-portal-root .uvm-deadline-list { flex-direction: column; flex-basis: 100%; }
      #uvm-portal-root .uvm-deadlines-cal { margin-left: 0; }
      #uvm-portal-root .uvm-section-head { flex-wrap: wrap; }
      #uvm-portal-root .uvm-coll-card.is-tall { grid-row: auto; }
    }
  </style>

  <!-- ================= SFS Deadline Strip ================= -->
  <section class="uvm-section" aria-labelledby="uvmDeadlinesHeading">
    <div class="uvm-deadlines">
      <h2 id="uvmDeadlinesHeading">Coming up</h2>
      <ul class="uvm-deadline-list" id="uvmDeadlineList"></ul>
      <a class="uvm-deadlines-cal" href="https://www.uvm.edu/studentfinancialservices/billing-and-payment-due-dates" target="_blank" rel="noopener">All billing dates &rarr;</a>
    </div>
  </section>

  <!-- ================= Quick access (rendered from QUICK_LINKS) ================= -->
  <section class="uvm-section" id="uvmQuick" aria-labelledby="uvmQuickHeading">
    <div class="uvm-section-head">
      <h2 id="uvmQuickHeading">Quick access</h2>
      <span class="uvm-eyebrow">Most-used tasks</span>
    </div>
    <ul class="uvm-quick-grid" id="uvmQuickGrid"></ul>
  </section>

  <!-- Sections and link collections are rendered here from SECTIONS -->
  <div id="uvmSections"></div>

</div>

<script>

    document.head.appendChild(link);
  }

     DATA — edit these arrays to update page content.
     No other part of this script needs to change.

    { label: 'View & Pay Accounts', desc: 'Balance, activity, and bills', icon: 'wallet', href: 'https://quikpayasp.com/uvm/quikpay/spa/viewandpayindex.do?dm=uvm_campus_tuition_payer' },

  // Sections → cards → links.
  // Card options:
  //   tall: true  → card spans two rows on wide screens (long lists)
  //   wide: true  → card spans the full row, links flow into columns

    {
      id: 'billing',

        {

            { label: 'Email sfs@uvm.edu', href: 'mailto:sfs@uvm.edu' },
            { label: 'Call (802) 656-5700', href: 'tel:+18026565700' }
          ]

      ]

  ];

  var STROKE = ' fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"';
  var ICONS = {
    wallet: '<path d="M4 7.5h15a1.5 1.5 0 011.5 1.5v10A1.5 1.5 0 0119 20.5H5.5A1.5 1.5 0 014 19V7.5zM4 7.5l11.5-3.5 1 3.5"' + STROKE + '/><path d="M20.5 11.5H17a2 2 0 000 4h3.5"' + STROKE + '/>',

    doc: '<path d="M6 2h8l4 4v16H6V2z"' + STROKE + '/><path d="M14 2v4h4M9 12h6M9 16h6"' + STROKE + '/>',
    cap: '<path d="M2.5 9L12 4.5 21.5 9 12 13.5 2.5 9z"' + STROKE + '/><path d="M6.5 11v4.5c1.5 1.4 3.5 2.1 5.5 2.1s4-.7 5.5-2.1V11M21.5 9v5"' + STROKE + '/>',
    briefcase: '<rect x="3" y="7" width="18" height="13" rx="1.8"' + STROKE + '/><path d="M8.5 7V5.2c0-.9.8-1.7 1.7-1.7h3.6c.9 0 1.7.8 1.7 1.7V7M3 12.5h18"' + STROKE + '/>',
    people: '<circle cx="9" cy="8.5" r="3.2"' + STROKE + '/><path d="M3 19.5c.8-3.4 3.2-5.2 6-5.2s5.2 1.8 6 5.2M15.5 5.6a3.2 3.2 0 010 5.8M17.5 14.6c1.8.6 3 2.2 3.5 4.9"' + STROKE + '/>',
    phone: '<path d="M6.5 3.5h3l1.5 4-2 1.5a11 11 0 006 6l1.5-2 4 1.5v3a2 2 0 01-2 2A16 16 0 014.5 5.5a2 2 0 012-2z"' + STROKE + '/>'
  };

  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html !== undefined) e.innerHTML = html;
    return e;
  }

  var ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) { return ESC_MAP[c]; });
  }

  function iconSvg(name) {
    return '<span class="uvm-coll-icon"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' + (ICONS[name] || '') + '</svg></span>';
  }

  // Web links open in a new tab; mailto:/tel: open in place.
  function isWeb(href) {
    return /^https?:/i.test(href);
  }
  function setLink(a, href) {
    a.href = href;
    if (isWeb(href)) {
      a.target = '_blank';
      a.rel = 'noopener';
    }
  }

  /* ------------------------------------------------------------
     Deadline strip
  ------------------------------------------------------------ */
  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var WEEKDAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var DAY_MS = 86400000;

  // Parse 'YYYY-MM-DD' as a local date (new Date('YYYY-MM-DD') would be UTC
  // and can land on the previous day in Eastern time).
  function parseDate(s) {
    var p = s.split('-');
    return new Date(+p[0], +p[1] - 1, +p[2]);
  }

  var now = new Date();
  var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

  function daysFromToday(d) {
    return Math.round((d - today) / DAY_MS);
  }
  function shortDate(d) {
    return MONTHS[d.getMonth()] + ' ' + d.getDate();
  }
  function whenText(start, end) {
    var startIn = daysFromToday(start);
    if (end && startIn <= 0) return 'Now, through ' + shortDate(end);
    var range = end ? shortDate(start) + '–' + shortDate(end) : WEEKDAYS[start.getDay()];
    if (startIn === 0) return 'Today';
    if (startIn === 1) return 'Tomorrow';
    if (startIn <= 14) return 'In ' + startIn + ' days';
    return range;
  }

  var upcoming = DEADLINES
    .map(function (d) {
      return { item: d, start: parseDate(d.date), end: d.endDate ? parseDate(d.endDate) : null };
    })
    .filter(function (d) { return daysFromToday(d.end || d.start) >= 0; })
    .sort(function (a, b) { return a.start - b.start; })
    .slice(0, MAX_DEADLINES);

  var deadlineList = document.getElementById('uvmDeadlineList');

  if (!upcoming.length) {
    deadlineList.appendChild(el('li', 'uvm-deadlines-empty',
      'No upcoming dates posted. See billing and payment due dates for next term.'));
  }

  upcoming.forEach(function (d, i) {
    var li = el('li', 'uvm-deadline');
    if (i === 0 && daysFromToday(d.start) <= URGENT_DAYS) li.classList.add('is-urgent');

    var titleHtml = d.item.href
      ? '<a class="uvm-deadline-title" href="' + esc(d.item.href) + '" target="_blank" rel="noopener">' + esc(d.item.title) + '</a>'
      : '<span class="uvm-deadline-title">' + esc(d.item.title) + '</span>';

    li.innerHTML =
      '<time class="uvm-deadline-date" datetime="' + esc(d.item.date) + '">' +
        '<span class="uvm-deadline-month">' + MONTHS[d.start.getMonth()] + '</span>' +
        '<span class="uvm-deadline-day">' + d.start.getDate() + '</span>' +
      '</time>' +
      '<div>' + titleHtml +
        '<span class="uvm-deadline-when">' + whenText(d.start, d.end) + '</span>' +
      '</div>';
    deadlineList.appendChild(li);
  });

  /* ------------------------------------------------------------
     Quick access tiles
  ------------------------------------------------------------ */
  var quickGrid = document.getElementById('uvmQuickGrid');
  document.getElementById('uvmQuick').hidden = QUICK_LINKS.length === 0;

  QUICK_LINKS.forEach(function (q) {
    var li = el('li');
    var a = el('a', 'uvm-quick-tile', iconSvg(q.icon));
    setLink(a, q.href);

    var text = el('span', 'uvm-quick-text');
    var labelEl = el('span', 'uvm-coll-label');
    labelEl.textContent = q.label;
    text.appendChild(labelEl);
    if (q.desc) {
      var descEl = el('span', 'uvm-coll-desc');
      descEl.textContent = q.desc;
      text.appendChild(descEl);
    }
    if (isWeb(q.href)) text.appendChild(el('span', 'uvm-sr-only', ' (opens in a new tab)'));
    a.appendChild(text);
    li.appendChild(a);
    quickGrid.appendChild(li);
  });

  /* ------------------------------------------------------------
     Sections and link collections
  ------------------------------------------------------------ */
  var sectionsRoot = document.getElementById('uvmSections');

  function fileType(href) {
    var m = /\.(pdf|docx?|xlsx?|pptx?)($|[?#])/i.exec(href);
    return m ? m[1].toUpperCase() : '';
  }

  SECTIONS.forEach(function (s, si) {
    var sectionId = 'uvmSection-' + (s.id || si);
    var headingId = sectionId + '-heading';
    var section = el('section', 'uvm-section');
    section.id = sectionId;
    section.setAttribute('aria-labelledby', headingId);

    var head = el('div', 'uvm-section-head');
    var h2 = el('h2');
    h2.id = headingId;
    h2.textContent = s.heading;
    head.appendChild(h2);
    if (s.eyebrow) {
      var eb = el('span', 'uvm-eyebrow');
      eb.textContent = s.eyebrow;
      head.appendChild(eb);
    }
    section.appendChild(head);

    var grid = el('div', 'uvm-coll-grid');

    s.cards.forEach(function (c) {
      var card = el('div', 'uvm-coll-card');
      if (c.tall) card.classList.add('is-tall');
      if (c.wide) card.classList.add('is-wide');

      card.innerHTML =
        '<div class="uvm-coll-head">' + iconSvg(c.icon) +
          '<h3>' + esc(c.title) + '</h3>' +
        '</div>';

      var ul = el('ul', 'uvm-coll-list');
      c.links.forEach(function (l) {
        var li = el('li');
        var a = el('a', 'uvm-coll-link');
        setLink(a, l.href);

        var labelEl = el('span', 'uvm-coll-label');
        labelEl.textContent = l.label;
        a.appendChild(labelEl);

        var ft = fileType(l.href);
        if (ft) a.appendChild(el('span', 'uvm-filetag', ft));

        if (l.desc) {
          var descEl = el('span', 'uvm-coll-desc');
          descEl.textContent = l.desc;
          a.appendChild(descEl);
        }
        if (isWeb(l.href)) a.appendChild(el('span', 'uvm-sr-only', ' (opens in a new tab)'));

        li.appendChild(a);
        ul.appendChild(li);
      });

      card.appendChild(ul);
      grid.appendChild(card);
    });

    section.appendChild(grid);
    sectionsRoot.appendChild(section);
  });

})();
</script>
